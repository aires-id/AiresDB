name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - name: Instantiate
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Test
        run: julia --startup-file=no --threads=1 --project=. -e 'using Pkg; Pkg.test()'
      - name: App entry point
        run: |
          julia --startup-file=no -e 'using Pkg; Pkg.Apps.develop(path=pwd())'
          echo "$HOME/.julia/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.julia/bin:$PATH"
          airesdb -u root -p --help
